<div class = "container">
    <h1>Lista de Usuários</h1>
    <table class="table">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Email</th>
                <th>Sexo</th>
            </tr>
        </thead>
        <tbody>
            {% for user in novousuario  %} <!-- atualizar para incluir users antigos-->
            <tr>
                <td>{{ user.nome }}</td>
                <td>{{ user.idade }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.sexo }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
